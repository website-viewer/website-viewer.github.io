<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Website Viewer</title>
    <meta name="description" content="Get in touch with the Website Viewer team for support, feedback, or inquiries.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header id="header-component"></header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>Contact Us</h1>
                <p class="hero-subtitle">Have questions or feedback? We'd love to hear from you.</p>
            </div>
        </section>

        <section class="section">
            <div class="container" style="max-width: 800px;">
                <div class="viewer-container">
                    <p>The best way to reach us is through our GitHub repository. Whether you have a feature request, found a bug, or want to contribute, our community is open to everyone.</p>
                    <div class="cta-buttons" style="margin-top: 2rem;">
                        <a href="https://github.com/website-viewer" target="_blank" class="btn btn-primary">Visit GitHub Issues</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="footer-component"></footer>

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "ContactPage",
        "name": "Contact Website Viewer",
        "description": "Contact information for Website Viewer support and feedback.",
        "url": "https://website-viewer.github.io/contact.html"
    }
    </script>
    <script src="script.js"></script>
</body>
</html>
